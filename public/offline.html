<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>Sin conexión — Many Champs</title>
    <link rel="icon" href="/icons/icon-192.png">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
            background: #0f172a;
            color: #e2e8f0;
            font-family: Roboto, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .panel {
            position: relative;
            width: 100%;
            max-width: 360px;
            padding: 28px 24px;
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }
        /* Pitch stripe: firma del sistema */
        .panel::before {
            content: "";
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: #10b981;
            border-radius: 0 9999px 9999px 0;
        }
        .label {
            margin: 0 0 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #64748b;
        }
        h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: #fff; text-wrap: balance; }
        p { margin: 8px 0 24px; font-size: 14px; line-height: 1.5; color: #94a3b8; text-wrap: pretty; }
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 44px;
            border: 0;
            border-radius: 8px;
            background: #10b981;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 150ms cubic-bezier(0.23, 1, 0.32, 1), background-color 150ms;
        }
        button:active { transform: scale(0.97); background: #059669; }
        button:focus-visible { outline: 2px solid rgba(16, 185, 129, 0.5); outline-offset: 2px; }
    </style>
</head>
<body>
    <main class="panel">
        <p class="label">Sin conexión</p>
        <h1>No hay señal en la cancha</h1>
        <p>Los marcadores y sanciones se cargan siempre en vivo para que nunca veas datos viejos. Vuelve a intentarlo cuando tengas conexión.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
    <script>
        // Al volver la red, recargar solo
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
